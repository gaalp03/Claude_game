<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07080f" />
    <title>GHOST LOOP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307080f'/%3E%3Crect x='3' y='4' width='6' height='8' fill='%23b44cff' opacity='.6'/%3E%3Crect x='7' y='4' width='6' height='8' fill='%2300f0ff'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #07080f; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* a középre igazítást a Phaser (Scale.CENTER_BOTH) végzi; itt csak teljes képernyős tároló */
      #game { position: fixed; inset: 0; overflow: hidden; }
      #game canvas { display: block; }

      /* álló telefonon: "fordítsd el" képernyő (csak kódból rajzolva, kép nélkül) */
      #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 24px; box-sizing: border-box; text-align: center; color: #e8ecff;
        background: radial-gradient(ellipse at 50% 40%, #1d0f45 0%, #07080f 70%); font-family: 'Exo 2', system-ui, sans-serif; }
      body.show-rotate #rotate { display: flex; }
      #rotate .phone { width: 46px; height: 80px; border: 3px solid #00f0ff; border-radius: 10px; position: relative;
        box-shadow: 0 0 18px rgba(0, 240, 255, 0.55), inset 0 0 10px rgba(0, 240, 255, 0.25); animation: gl-rotate 2.4s ease-in-out infinite; }
      #rotate .phone::after { content: ''; position: absolute; left: 50%; bottom: 6px; width: 10px; height: 3px; margin-left: -5px; border-radius: 2px; background: #00f0ff; }
      #rotate .ghost { position: absolute; left: 12px; top: 24px; width: 16px; height: 20px; border-radius: 8px 8px 2px 2px; background: rgba(180, 76, 255, 0.75); box-shadow: 0 0 10px rgba(180, 76, 255, 0.8); }
      #rotate h1 { margin: 10px 0 0; font: 900 20px/1.2 Orbitron, 'Exo 2', sans-serif; letter-spacing: 2px; text-shadow: 0 0 12px rgba(0, 240, 255, 0.7); }
      #rotate p { margin: 0; font-size: 14px; color: #7f89b8; }
      #rotate button { margin-top: 10px; padding: 10px 22px; border-radius: 22px; border: 1.5px solid #7f89b8; background: rgba(11, 13, 34, 0.9);
        color: #e8ecff; font: 700 12px Orbitron, 'Exo 2', sans-serif; letter-spacing: 1px; }
      @keyframes gl-rotate { 0%, 25% { transform: rotate(0deg); } 55%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="dialog" aria-label="Rotate your device">
      <div class="phone"><div class="ghost"></div></div>
      <h1>ROTATE YOUR DEVICE</h1>
      <p>Ghost Loop plays best in landscape.</p>
      <button id="rotate-dismiss" type="button">PLAY ANYWAY</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
